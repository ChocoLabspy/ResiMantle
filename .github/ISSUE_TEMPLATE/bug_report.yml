name: Bug Report
description: Create a report to help us improve ResiMantle
title: "[BUG] "
labels: ["bug", "triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! 
        *If this is a security vulnerability, please do NOT use this form. Follow the private reporting guidance in SECURITY.md instead.*
  - type: input
    id: version
    attributes:
      label: ResiMantle Version
      description: Which version of the CLI or Core are you using?
      placeholder: "e.g. 0.1.0"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: Node.js version, OS, etc.
      placeholder: "Node 20.10.0 on Ubuntu 22.04"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this bug?
      value: |
        1. 
        2. 
        3. 
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / Output
      description: Paste any relevant logs or output. Please ensure no sensitive information is included!
      render: shell
