name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Run Tests
        run: pnpm test

      - name: Package Release Bundle
        run: |
          mkdir -p .artifacts
          tar -czf ".artifacts/resimantle-${GITHUB_REF_NAME}.tar.gz" README.md LICENSE CHANGELOG.md apps/cli/dist packages/core/dist packages/types/dist docs examples

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: .artifacts/*.tar.gz
          generate_release_notes: true
          fail_on_unmatched_files: true
